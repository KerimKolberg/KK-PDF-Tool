name: doc_scanner
description: "KK-PDF-Tool: document scanner and PDF toolkit for Android and Windows."
publish_to: 'none'

# <version name>+<build number>. CI replaces the build number with the run
# number of the build, so every build installs as an update of the last.
version: 1.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.1
  image: ^4.10.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  path: ^1.9.1
  file_selector: ^1.1.0
  camera_windows: ^0.2.6+5
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pdfrx: ^2.10.1
  shared_preferences: ^2.5.5
  cunning_document_scanner: ^3.0.3
  archive: ^4.0.9
  google_sign_in: ^7.2.0
  http: ^1.6.0
  crypto: ^3.0.7
  markdown: ^7.3.1
  window_manager: ^0.5.2
  tray_manager: ^0.2.4
  desktop_drop: ^0.8.4
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  # Padded so round/rounded launcher masks don't cut the logo off.
  image_path: "assets/icon/app_icon_padded.png"
  adaptive_icon_background: "#0E2038"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground image already has its own margin; no extra shrinking.
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.ico
    - assets/icon/app_icon.png
