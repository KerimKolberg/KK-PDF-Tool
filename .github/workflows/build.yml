name: Build APK & Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Decode release keystore (if configured)
        env:
          DOCSCANNER_KEYSTORE_BASE64: ${{ secrets.DOCSCANNER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DOCSCANNER_KEYSTORE_BASE64" ]; then
            echo "$DOCSCANNER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/docscanner-release.jks"
            echo "DOCSCANNER_KEYSTORE_PATH=$RUNNER_TEMP/docscanner-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          DOCSCANNER_KEYSTORE_PASSWORD: ${{ secrets.DOCSCANNER_KEYSTORE_PASSWORD }}
          DOCSCANNER_KEY_ALIAS: ${{ secrets.DOCSCANNER_KEY_ALIAS }}
          DOCSCANNER_KEY_PASSWORD: ${{ secrets.DOCSCANNER_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk KK-PDF-Tool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KK-PDF-Tool-Android-APK
          path: KK-PDF-Tool.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath KK-PDF-Tool-Windows-Portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=$version" windows\installer\kk-pdf-tool.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KK-PDF-Tool-Windows-Setup
          path: build/installer/KK-PDF-Tool-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KK-PDF-Tool-Windows-Portable
          path: KK-PDF-Tool-Windows-Portable.zip
          if-no-files-found: error
