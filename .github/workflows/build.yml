name: Build APK & Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/android-build.log
        continue-on-error: true

      - name: Save build log to repo for diagnosis
        if: always()
        run: |
          mkdir -p .ci-logs
          tail -c 100000 /tmp/android-build.log > .ci-logs/android-build.log
          git config user.email "ci@doc-scanner-app.local"
          git config user.name "CI Diagnostics"
          git add .ci-logs/android-build.log
          git commit -m "ci: capture android build log [skip ci]" || echo "no changes to commit"
          git push

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows EXE (with retries for flaky Gradle/package downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath doc-scanner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-windows-exe
          path: doc-scanner-windows.zip
          if-no-files-found: error
