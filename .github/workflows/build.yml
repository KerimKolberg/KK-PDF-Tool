name: Build APK & Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        id: build
        run: flutter build apk --release --verbose 2>&1 | tee /tmp/android-build.log
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p .ci-logs
          tail -c 60000 /tmp/android-build.log > .ci-logs/android-build.log
          git config user.email "ci@doc-scanner-app.local"
          git config user.name "CI Diagnostics"
          git add .ci-logs/android-build.log
          git commit -m "ci: capture failed android build log [skip ci]"
          git push

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath doc-scanner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-windows-exe
          path: doc-scanner-windows.zip
