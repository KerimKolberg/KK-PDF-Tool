name: Build APK & Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Decode release keystore (if configured)
        env:
          DOCSCANNER_KEYSTORE_BASE64: ${{ secrets.DOCSCANNER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DOCSCANNER_KEYSTORE_BASE64" ]; then
            echo "$DOCSCANNER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/docscanner-release.jks"
            echo "DOCSCANNER_KEYSTORE_PATH=$RUNNER_TEMP/docscanner-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          DOCSCANNER_KEYSTORE_PASSWORD: ${{ secrets.DOCSCANNER_KEYSTORE_PASSWORD }}
          DOCSCANNER_KEY_ALIAS: ${{ secrets.DOCSCANNER_KEY_ALIAS }}
          DOCSCANNER_KEY_PASSWORD: ${{ secrets.DOCSCANNER_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath doc-scanner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-windows-exe
          path: doc-scanner-windows.zip
          if-no-files-found: error
