name: Build APK & Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK (with retries for flaky Gradle downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows EXE (with retries for flaky Gradle/package downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath doc-scanner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-windows-exe
          path: doc-scanner-windows.zip
          if-no-files-found: error
